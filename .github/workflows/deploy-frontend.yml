# Deploys the frontend to Cloudflare Workers.
#
# Requires the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit
# permission). Manual trigger for now — once the token is configured and a
# deploy has been verified, add `push: { branches: [main] }` to deploy
# automatically.
name: Deploy Frontend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Sem VITE_API_URL o bundle chama /api na própria origem do worker e
      # todas as chamadas de API falham em produção.
      - name: Fail if VITE_API_URL is missing
        if: ${{ vars.VITE_API_URL == '' }}
        run: |
          echo "::error::Configure a variável de repositório VITE_API_URL (Settings > Secrets and variables > Actions > Variables) com a URL pública do backend, ex.: https://api.seudominio.com.br"
          exit 1

      - name: Build
        env:
          # Valores públicos, embutidos no bundle e na CSP do worker no build.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_MERCADO_PAGO_PUBLIC_KEY: ${{ vars.VITE_MERCADO_PAGO_PUBLIC_KEY }}
        run: bun run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy
