# Deploys the frontend to Cloudflare Workers.
#
# Requires the repository secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit
# permission). Manual trigger for now — once the token is configured and a
# deploy has been verified, add `push: { branches: [main] }` to deploy
# automatically.
name: Deploy Frontend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler deploy
